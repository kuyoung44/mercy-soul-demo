<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercySoul Vision Brain</title>
    <style>
        body { background: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
        .header { background: linear-gradient(90deg, #4b0082, #1a1a2e); padding: 20px; text-align: center; border-bottom: 2px solid #d4af37; }
        .header h1 { color: #d4af37; margin: 0; font-size: 1.5rem; }
        .header p { color: #ccc; margin: 5px 0 0; font-size: 0.8rem; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 15px; border-radius: 15px; font-size: 1rem; line-height: 1.5; }
        .user { align-self: flex-end; background: linear-gradient(90deg, #d4af37, #b8860b); color: black; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: #1a1a2e; border: 1px solid #444; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; background: #0d0d1a; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #d4af37; background: #111; color: white; outline: none; font-size: 1rem; user-select: text; -webkit-user-select: text; }
        button { padding: 12px 20px; border-radius: 25px; border: none; background: #d4af37; color: black; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #b8860b; }
        .loading { font-size: 0.8rem; color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👑 MercySoul Vision Brain</h1>
        <p>Where Imagination Becomes Sacred Art</p>
    </div>
    <div class="chat-container" id="chatBox">
        <div class="message bot">Welcome, Aṣẹ. How can I assist you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Copy-protection for rendered chat content. The input remains editable/selectable.
        ['contextmenu', 'copy', 'cut', 'dragstart'].forEach(function (eventName) {
            document.addEventListener(eventName, function (event) {
                if (event.target.id !== 'userInput') event.preventDefault();
            });
        });

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="message user">${message}</div>`;
            input.value = '';
            
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerText = 'MercySoul is thinking...';
            chatBox.appendChild(loading);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Use the endpoint you have in your server.js (e.g., /chat, /api/chat)
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                loading.remove();
                chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
            } catch (error) {
                loading.remove();
                chatBox.innerHTML += `<div class="message bot">Connection error. Try again later.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
